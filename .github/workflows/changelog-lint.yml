name: Changelog Lint

on:
  pull_request:
    paths:
      - CHANGELOG.md

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CHANGELOG.md format
        run: |
          set -e
          file=CHANGELOG.md
          if ! grep -q '^## \[Unreleased\]' "$file"; then
            echo "ERROR: missing '## [Unreleased]' section";
            exit 1
          fi
          # ensure at least one released version with date
          if ! grep -q '^## \[[0-9]\+\.[0-9]\+\.[0-9]\+\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' "$file"; then
            echo "ERROR: no released version header found (e.g. '## [0.1.0] - 2026-02-23')";
            exit 1
          fi
          echo "CHANGELOG.md looks good!"
