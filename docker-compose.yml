services:
  db:
    image: postgres:15-alpine
    container_name: happy-schools-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: happy_schools
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d happy_schools"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: happy-schools-backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend/app:/app/app
      - ./backend/static:/app/static
      - ./backend/data:/app/data
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - FRONTEND_URL=${FRONTEND_URL:-https://schoolmanager.id.vn}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://schoolmanager.id.vn}
      - TRUSTED_PROXY_HOSTS=${TRUSTED_PROXY_HOSTS:-172.16.0.0/12}
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD}@db:5432/happy_schools
      - DATABASE_URL_SYNC=postgresql://admin:${POSTGRES_PASSWORD}@db:5432/happy_schools
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}

    container_name: happy-schools-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
