version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: happy-schools-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: happyschools2026
      POSTGRES_DB: happy_schools
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: happy-schools-backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend/app:/app/app
      - ./backend/static:/app/static
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:happyschools2026@db:5432/happy_schools
      - DATABASE_URL_SYNC=postgresql://admin:happyschools2026@db:5432/happy_schools
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: .
    container_name: happy-schools-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
