version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: happy-schools-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: happyschools2026
      POSTGRES_DB: happy_schools
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: happy-schools-backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend/app:/app/app
      - ./backend/static:/app/static
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=false
      - DATABASE_URL=postgresql://admin:happyschools2026@db:5432/happy_schools
      - DATABASE_URL_SYNC=postgresql://admin:happyschools2026@db:5432/happy_schools
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: https://api.schoolmanager.id.vn

    container_name: happy-schools-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.schoolmanager.id.vn
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: happy-schools-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  postgres_data:
